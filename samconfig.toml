version = 0.1

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
stack_name = "one-piece-x-platform"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
region = "us-east-1"
parameter_overrides = [
  "OAuthCallbackBaseUrl=https://example.com",
  "XClientId=SU5iNjluV2FtTDF2dWRMaVdwWk46MTpjaQ",
  "XClientSecretSecretName=one-piece-content-automation-platform/social/x/client-secret",
  "XAuthorizeUrl=https://x.com/i/oauth2/authorize",
  "XTokenUrl=https://api.x.com/2/oauth2/token"
]
