name: Python CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Validate Lambda handlers and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install 'pytest==8.4.2'
      - name: Validate Python syntax
        run: python -m compileall -q lambdas automation tests
      - name: Run all offline regression tests
        run: python -m pytest -q
